<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>1000pets</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="bg-ink text-slate-100 font-sans antialiased p-4 pb-10 max-w-xl mx-auto">
<h1 class="text-xl font-semibold mb-3">1000pets</h1>

<section class="bg-panel rounded-xl p-4 mb-3">
  <div class="text-3xl font-semibold tabular-nums" id="time">--</div>
  <div class="text-sm text-mute" id="meta">connecting…</div>
  <div class="flex gap-2 mt-3" id="speeds"></div>
  <button id="pause" class="mt-2 w-full py-3 rounded-lg bg-slate-700 active:bg-slate-600">Pause</button>
</section>

<section class="bg-panel rounded-xl p-4 mb-3">
  <h2 class="text-xs uppercase tracking-wider text-mute mb-2">Room</h2>
  <canvas id="map" width="1000" height="700" class="w-full h-auto block rounded-lg bg-black"></canvas>
  <div class="mt-3 flex items-center justify-between gap-4">
    <div class="text-sm text-mute">Move yourself (the white diamond). Pets can see and bump into you. Use WASD or arrow keys on a computer.</div>
    <div id="pad" class="relative shrink-0 w-32 h-32 rounded-full bg-slate-700/60 border border-line select-none" style="touch-action:none">
      <div id="knob" class="absolute w-12 h-12 rounded-full bg-accent/80" style="left:40px;top:40px"></div>
    </div>
  </div>
</section>

<section class="bg-panel rounded-xl p-4 mb-3">
  <h2 class="text-xs uppercase tracking-wider text-mute mb-2">Pets</h2>
  <div id="pets" class="space-y-2"></div>
</section>

<section class="bg-panel rounded-xl p-4 mb-3">
  <h2 class="text-xs uppercase tracking-wider text-mute mb-2">Environment</h2>
  <div class="grid grid-cols-2 gap-x-4 gap-y-2" id="env"></div>
</section>

<section class="bg-panel rounded-xl p-4 mb-3">
  <h2 class="text-xs uppercase tracking-wider text-mute mb-2">AI usage</h2>
  <div id="llm" class="text-sm space-y-2"></div>
</section>

<section class="bg-panel rounded-xl p-4 mb-3">
  <h2 class="text-xs uppercase tracking-wider text-mute mb-2">Events</h2>
  <ul id="events" class="max-h-64 overflow-auto text-sm"></ul>
</section>

<script>
const SPEEDS = [1, 10, 100, 1000];
let state = null, layout = null;
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const ANOMALY = new Set(["curtain_stuck"]);

function render() {
  if (!state) return;
  $("time").textContent = `Day ${state.day} · ${pad(state.hour)}:${pad(state.minute)}`;
  $("meta").textContent = `${state.speed}× speed${state.paused ? " · paused" : ""}`;
  $("pause").textContent = state.paused ? "Resume" : "Pause";
  document.querySelectorAll("#speeds button").forEach((b) => {
    const on = Number(b.dataset.s) === state.speed;
    b.classList.toggle("bg-accent", on); b.classList.toggle("text-emerald-950", on);
    b.classList.toggle("font-semibold", on); b.classList.toggle("bg-slate-700", !on);
  });
  if (state.env) { renderEnv(state.env); drawMap(); }
  if (state.pets) renderPets(state.pets);
}

const openPets = new Set();
const ACTION_TEXT = { dormant: "powered down", avoid: "avoiding an obstacle", sleep: "sleeping", charge: "charging", seek_light: "seeking light",
  approach_pet: "going to a pet", socialize: "with a pet", approach_object: "going to look at something", inspect: "inspecting", wander: "wandering", pause: "pausing" };
const bar = (label, v, color) => `<div class="flex items-center gap-2 text-xs"><span class="w-16 text-mute">${label}</span><div class="flex-1 h-1.5 bg-slate-700 rounded"><div class="h-1.5 rounded" style="width:${Math.round(v * 100)}%;background:${color}"></div></div><span class="w-8 text-right tabular-nums">${Math.round(v * 100)}</span></div>`;

function renderPets(pets) {
  const root = $("pets");
  for (const p of pets) {
    let card = document.getElementById("pet-" + p.id);
    if (!card) {
      card = document.createElement("div");
      card.id = "pet-" + p.id;
      card.className = "rounded-lg bg-ink/60 p-3";
      card.innerHTML = `<button class="w-full text-left flex items-center gap-2" data-id="${p.id}"><span class="inline-block w-3 h-3 rounded-full" style="background:${p.color}"></span><span class="font-semibold">${p.name}</span><span class="text-sm text-mute flex-1" data-f="action"></span><span class="text-mute text-sm" data-f="chev">▾</span></button><div data-f="bars" class="mt-2 space-y-1"></div><div data-f="mind" class="hidden mt-3 text-xs space-y-0.5"></div><ul data-f="thoughts" class="hidden mt-2 text-xs max-h-64 overflow-auto"></ul>`;
      card.querySelector("button").onclick = () => { openPets.has(p.id) ? openPets.delete(p.id) : openPets.add(p.id); loadThoughts(p.id); };
      root.appendChild(card);
    }
    card.querySelector('[data-f="action"]').textContent = ACTION_TEXT[p.action] || p.action;
    card.querySelector('[data-f="bars"]').innerHTML = bar("battery", p.energy / 100, "#6cc4a1") + bar("curiosity", p.drives.curiosity, "#fbbf24") + bar("social", p.drives.social, "#f472b6") + bar("rest", p.drives.rest, "#60a5fa");
  }
}

async function loadThoughts(id) {
  const card = document.getElementById("pet-" + id); if (!card) return;
  const ul = card.querySelector('[data-f="thoughts"]'), mind = card.querySelector('[data-f="mind"]'), open = openPets.has(id);
  ul.classList.toggle("hidden", !open); mind.classList.toggle("hidden", !open); card.querySelector('[data-f="chev"]').textContent = open ? "▴" : "▾";
  if (!open) return;
  const [list, m] = await Promise.all([fetch(`/api/thoughts/${id}?limit=30`).then((r) => r.json()), fetch(`/api/mind/${id}`).then((r) => r.json())]);
  const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  mind.innerHTML = `<div><span class="text-mute">Question:</span> ${esc(m.question || "—")}</div><div><span class="text-mute">Intention:</span> ${esc(m.intention || "—")}</div>` +
    `<div class="text-mute mt-1">Beliefs</div>` + (m.beliefs.length ? m.beliefs.map((b) => `<div>• ${esc(b.text)} <span class="text-mute">${Math.round(b.confidence * 100)}%</span></div>`).join("") : "<div class='text-mute'>none yet</div>");
  ul.innerHTML = list.reverse().map((t) => {
    const when = `<span class="text-mute tabular-nums">D${t.day} ${pad(t.hour)}:${pad(t.minute)}</span>`;
    if (t.system === 2) return `<li class="py-1 border-b border-line">${when} <span class="text-violet-400">S2</span> ${esc(t.thought)} <span class="text-mute">— ${esc(t.question)} · ${t.provider}</span></li>`;
    return `<li class="py-1 border-b border-line">${when} <span class="text-accent">S1</span> ${ACTION_TEXT[t.action] || t.action} <span class="text-mute">— ${esc(t.reason)}</span></li>`;
  }).join("") || '<li class="text-mute">no thoughts yet</li>';
}
setInterval(() => openPets.forEach(loadThoughts), 4000);

async function loadLlm() {
  const d = await fetch("/api/llm").then((r) => r.json());
  $("llm").innerHTML = !d.enabled ? '<div class="text-mute">No API keys set, System 2 is off.</div>' : d.providers.map((p) => {
    const status = p.cooldownSec > 0 ? `<span class="text-amber-400">cooling down ${p.cooldownSec > 3600 ? Math.round(p.cooldownSec / 3600) + " h" : p.cooldownSec + " s"}</span>` : '<span class="text-accent">ready</span>';
    return `<div><div class="flex justify-between"><span class="font-semibold">${p.name}</span>${status}</div><div class="text-xs text-mute">${p.model} · ${p.calls} calls · ${(p.tokensIn + p.tokensOut).toLocaleString()} tokens${p.spendUsd ? " · $" + p.spendUsd.toFixed(3) : ""}${p.failures ? " · " + p.failures + " failed" : ""}</div>${p.lastError ? `<div class="text-xs text-mute truncate">last error: ${p.lastError}</div>` : ""}</div>`;
  }).join("");
}
loadLlm(); setInterval(loadLlm, 10000);

function renderEnv(e) {
  const rows = [
    ["Weather", e.weather], ["Sun", Math.round(e.sunIntensity * 100) + "%"],
    ["Outdoor", e.outdoorTemp.toFixed(1) + " °C"], ["Indoor", e.indoorTemp.toFixed(1) + " °C"],
    ["Curtain", e.curtainOpen ? "open" : "closed"], ["Door", e.doorOpen ? "open" : "closed"],
    ["Lamp", e.lampOn ? "on" : "off"], ["Heater", e.heaterOn ? "on" : "off"],
  ];
  $("env").innerHTML = rows.map(([k, v]) => `<div><div class="text-xs text-mute">${k}</div><div class="text-base font-semibold">${v}</div></div>`).join("");
}

function drawMap() {
  if (!layout || !state.env) return;
  const c = $("map"), g = c.getContext("2d"), e = state.env;
  const dark = 1 - Math.min(1, 0.4 + e.sunIntensity * 0.8 + (e.lampOn ? 0.25 : 0));
  g.clearRect(0, 0, c.width, c.height);
  g.fillStyle = "#2a2f36"; g.fillRect(0, 0, c.width, c.height);
  // sun patch
  if (e.curtainOpen && e.sunIntensity > 0 && state.sunPatch) {
    const p = state.sunPatch, grad = g.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.r);
    grad.addColorStop(0, `rgba(255,224,130,${0.55 * e.sunIntensity})`); grad.addColorStop(1, "rgba(255,224,130,0)");
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  }
  const colors = { window: e.curtainOpen ? "#9fd4ff" : "#4a5563", door: e.doorOpen ? "#2b2b2b" : "#8b5e3c", plant: "#4caf50",
    table: "#7a5c3a", bed: "#5d6fa8", charger: "#e0c341", heater: e.heaterOn ? "#e8693c" : "#555", lamp: e.lampOn ? "#fff3a0" : "#777" };
  for (const o of layout.objects) {
    g.fillStyle = colors[o.kind] || "#999";
    if (o.kind === "plant" || o.kind === "lamp") { g.beginPath(); g.arc(o.x, o.y, o.w / 2, 0, 7); g.fill(); }
    else g.fillRect(o.x, o.y, o.w, o.h);
    g.fillStyle = "#cfd6dd"; g.font = "22px system-ui"; g.fillText(o.kind, o.x - (o.kind==="plant"||o.kind==="lamp"?o.w/2:0), o.y + (o.y > 600 ? -8 : o.h + 22 + (o.kind==="plant"||o.kind==="lamp"?o.w/2:0)));
  }
  // pets
  for (const p of state.pets || []) {
    g.save(); g.translate(p.x, p.y);
    g.globalAlpha = p.mode === "sleeping" ? 0.55 : p.mode === "dormant" ? 0.3 : 1;
    g.fillStyle = p.color; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill();
    g.rotate(p.heading); g.fillStyle = "#101418"; g.beginPath(); g.arc(11, 0, 4.5, 0, 7); g.fill();
    g.restore();
    g.fillStyle = "#fff"; g.font = "bold 22px system-ui"; g.textAlign = "center";
    g.fillText(p.name + (p.mode === "sleeping" ? " zz" : ""), p.x, p.y - 26); g.textAlign = "start";
  }
  // human
  if (state.human) {
    const h = state.human;
    g.save(); g.translate(h.x, h.y); g.fillStyle = "#f8fafc";
    g.beginPath(); g.moveTo(0, -20); g.lineTo(18, 0); g.lineTo(0, 20); g.lineTo(-18, 0); g.closePath(); g.fill(); g.restore();
    g.fillStyle = "#fff"; g.font = "bold 22px system-ui"; g.textAlign = "center"; g.fillText("You", h.x, h.y - 28); g.textAlign = "start";
  }
  // darkness overlay: night and no lights
  g.fillStyle = `rgba(5,8,25,${0.65 * dark})`; g.fillRect(0, 0, c.width, c.height);
  if (e.lampOn) {
    const l = layout.objects.find((o) => o.kind === "lamp");
    const grad = g.createRadialGradient(l.x, l.y, 5, l.x, l.y, 260);
    grad.addColorStop(0, "rgba(255,240,170,0.45)"); grad.addColorStop(1, "rgba(255,240,170,0)");
    g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  }
}

function addEvent(ev, prepend) {
  const li = document.createElement("li");
  li.className = "py-1.5 border-b border-line";
  li.innerHTML = `<span class="text-mute mr-1.5 tabular-nums">D${ev.day} ${pad(ev.hour)}:${pad(ev.minute)}</span><span class="${ANOMALY.has(ev.type) ? "text-amber-400" : ""}">${ev.type.replace(/_/g, " ")}${ev.detail ? " · " + ev.detail : ""}</span>`;
  const ul = $("events");
  if (prepend) ul.prepend(li); else ul.appendChild(li);
  while (ul.children.length > 60) ul.lastChild.remove();
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  if (r.ok) { state = { ...state, ...(await r.json()) }; render(); }
}

for (const s of SPEEDS) {
  const b = document.createElement("button");
  b.className = "flex-1 py-3 rounded-lg bg-slate-700 active:bg-slate-600";
  b.textContent = s + "×"; b.dataset.s = s;
  b.onclick = () => post("/api/speed", { speed: s });
  $("speeds").appendChild(b);
}
$("pause").onclick = () => post("/api/pause", { paused: !(state && state.paused) });

Promise.all([fetch("/api/status").then((r) => r.json()), fetch("/api/world").then((r) => r.json()), fetch("/api/events?limit=40").then((r) => r.json())])
  .then(([s, w, evs]) => { layout = w; state = { ...s, env: w.env, sunPatch: w.sunPatch, pets: w.pets, human: w.human }; evs.reverse().forEach((e) => addEvent(e, false)); render(); });

let wsRef = null;
const joy = { dx: 0, dy: 0 }, keys = new Set();
function sendInput() {
  let dx = joy.dx, dy = joy.dy;
  if (keys.size) {
    dx = (keys.has("d") || keys.has("arrowright") ? 1 : 0) - (keys.has("a") || keys.has("arrowleft") ? 1 : 0);
    dy = (keys.has("s") || keys.has("arrowdown") ? 1 : 0) - (keys.has("w") || keys.has("arrowup") ? 1 : 0);
  }
  if (wsRef && wsRef.readyState === 1) wsRef.send(JSON.stringify({ type: "input", dx, dy }));
}
setInterval(() => { if (joy.dx || joy.dy || keys.size) sendInput(); }, 100);
addEventListener("keydown", (e) => { const k = e.key.toLowerCase(); if ("wasd".includes(k) && k.length === 1 || k.startsWith("arrow")) { keys.add(k); e.preventDefault(); } });
addEventListener("keyup", (e) => { keys.delete(e.key.toLowerCase()); sendInput(); });
const joyPad = $("pad"), knob = $("knob");
function padMove(e) {
  const r = joyPad.getBoundingClientRect(), R = r.width / 2;
  let x = e.clientX - (r.left + R), y = e.clientY - (r.top + R);
  const len = Math.hypot(x, y), max = R - 24;
  if (len > max) { x = x / len * max; y = y / len * max; }
  knob.style.left = (R - 24 + x) + "px"; knob.style.top = (R - 24 + y) + "px";
  joy.dx = x / max; joy.dy = y / max; sendInput();
}
joyPad.addEventListener("pointerdown", (e) => { joyPad.setPointerCapture(e.pointerId); padMove(e); });
joyPad.addEventListener("pointermove", (e) => { if (joyPad.hasPointerCapture(e.pointerId)) padMove(e); });
const padEnd = () => { joy.dx = joy.dy = 0; knob.style.left = "40px"; knob.style.top = "40px"; sendInput(); };
joyPad.addEventListener("pointerup", padEnd); joyPad.addEventListener("pointercancel", padEnd);

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "status") { state = m; render(); }
    else if (m.type === "events") m.events.forEach((ev) => addEvent(ev, true));
  };
  wsRef = ws;
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
